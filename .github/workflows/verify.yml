name: verify

on:
  push:
    branches: ["main", "task/**", "integration"]
  pull_request:
    branches: ["main", "integration"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install C++ tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ cppcheck

      - name: Install Python tools
        run: python -m pip install -e ".[dev]"

      - name: Run CI evidence
        run: python tasks.py evidence --task ci
