[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "verifieds"
version = "0.1.0"
dependencies = [
    "pydantic==2.13.4",
    "mcp==1.30.0",
]


[project.optional-dependencies]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "vulture==2.16",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "B", "ARG", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.vulture]
min_confidence = 80
# Ignore MCP SDK tool registration decorators so registered tool functions are not flagged as unused
ignore_decorators = ["@mcp.tool", "@mcp_server.tool", "@server.tool"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=verifieds --cov-branch --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["verifieds"]

[tool.setuptools.packages.find]
where = ["."]
include = ["verifieds*"]
